<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>首页 - 星河科技</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.3.0/dist/ol.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./index.html">星河科技</a>
      <nav>
        <a class="active" href="./index.html">首页</a>
        <a href="./products.html">产品介绍</a>
        <a href="./contact.html">联系我们</a>
      </nav>
    </header>

    <main class="hero">
      <section>
        <p class="eyebrow">Digital operations platform</p>
        <h1>让业务系统更清晰、更高效地运转</h1>
        <p class="lead">星河科技为企业提供数据看板、自动化流程和客户协作工具，帮助团队把复杂工作整理成可执行的日常。</p>
        <a class="button" href="./products.html" style="display: block; margin: 26px auto 0; width: fit-content;">查看产品</a>
        <div id="map" style="height:400px; width:100%; margin-top: 20px;"></div>
      </section>
      <section class="hero-panel">
        <h2>今日概览</h2>
        <div class="metric">
          <span>项目交付率</span>
          <strong>96%</strong>
        </div>
        <div class="metric">
          <span>客户响应时间</span>
          <strong>12m</strong>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        var map = new ol.Map({
          target: 'map',
          layers: [
            new ol.layer.Tile({
              source: new ol.source.XYZ({
                url: ' http://wprd0{1-4}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}',
                subdomains: ['1','2','3','4']
              })
            })
          ],
          view: new ol.View({
            center: ol.proj.fromLonLat([116.397428, 39.90923]),
            zoom: 10
          })
        });
      });
    </script>
  </body>
</html>
